[project]
name = "primitive-db"
version = "0.1.0"
description = "primitive-db"
readme = "README.md"
authors = [
    { name = "kkorsy", email = "kkorsy@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
